name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # GitHub Pages has no SPA rewrite, so a direct visit or refresh on a
      # client-side route would hard-404. Serving index.html as the 404 page
      # loads the app and lets react-router resolve the path.
      - name: Add SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Deploy dist/ to milos.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: tangtaidvlp/milos.github.io
          publish_branch: main
          publish_dir: ./dist
